<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Cinema</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" href="icon.png">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><span class="logo">&#9654;</span> Home Cinema</div>
    <nav id="tabs">
      <div class="tab f" data-tab="movies">Movies</div>
      <div class="tab f" data-tab="shows">TV Shows</div>
      <div class="tab f" data-tab="music">Music</div>
      <div class="tab f" data-tab="folders">Folders</div>
    </nav>
    <div class="right">
      <div class="btn small f" id="rescanBtn" title="Rescan drives">&#8635; Rescan</div>
      <div id="clock"></div>
    </div>
  </header>
  <div id="filters"></div>
  <main id="content" class="scroll"></main>
  <div id="mini" class="hidden">
    <img id="miniArt" alt="">
    <div class="miniText"><div id="miniTitle"></div><div id="miniSub"></div><div class="bar"><i id="miniBar"></i></div></div>
    <div class="btn icon f" id="miniPrev">&#9198;</div>
    <div class="btn icon f" id="miniPlay">&#10074;&#10074;</div>
    <div class="btn icon f" id="miniNext">&#9197;</div>
  </div>
</div>

<div id="detail" class="layer hidden"></div>

<div id="player" class="layer hidden">
  <video id="video" preload="auto"></video>
  <div id="osd">
    <div class="osdTop"><div id="osdTitle"></div><div id="osdInfo"></div></div>
    <div class="osdBottom">
      <div class="osdTimes"><span id="osdCur">0:00</span><span id="osdState"></span><span id="osdDur">0:00</span></div>
      <div class="osdBar"><i id="osdBuf"></i><i id="osdProg"></i><b id="osdSeek"></b></div>
      <div class="osdHints">OK&nbsp;Play/Pause &nbsp;&nbsp; &#9664;&#9654;&nbsp;Seek &nbsp;&nbsp; &#9650;&nbsp;Subtitles &nbsp;&nbsp; &#9660;&nbsp;Audio language &nbsp;&nbsp; BACK&nbsp;Exit</div>
    </div>
  </div>
  <div id="spinner"></div>
</div>

<audio id="audio" preload="auto"></audio>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
